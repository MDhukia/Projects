<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Weather Search</title>
</head>

<body>

    <h1>Edit Weather Search</h1>

    <a href="/history">← Back to History</a>

    <hr>

    <form method="POST">

        <label for="location">Location:</label>

        <input
            type="text"
            id="location"
            name="location"
            value="{{ search.location_input }}"
            required
        >

        <br><br>

        <label for="average_temperature">
            Average Temperature:
        </label>

        <input
            type="number"
            step="0.1"
            id="average_temperature"
            name="average_temperature"
            value="{{ search.average_temperature }}"
        >

        <br><br>

        <label for="minimum_temperature">
            Minimum Temperature:
        </label>

        <input
            type="number"
            step="0.1"
            id="minimum_temperature"
            name="minimum_temperature"
            value="{{ search.minimum_temperature }}"
        >

        <br><br>

        <label for="maximum_temperature">
            Maximum Temperature:
        </label>

        <input
            type="number"
            step="0.1"
            id="maximum_temperature"
            name="maximum_temperature"
            value="{{ search.maximum_temperature }}"
        >

        <br><br>

        <button type="submit">
            Update Weather
        </button>

    </form>

</body>

</html>
